workflows:
  android-debug:
    name: Liquid Launcher (debug APK)
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Gradle wrapper 생성
        script: gradle wrapper --gradle-version 8.7
      - name: 디버그 APK 빌드
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
